name: CD - Ubuntu images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ubuntu-images
  cancel-in-progress: false

jobs:
  # After CI, publish only when the image sources changed. The schedule and
  # manual runs always publish so that the image picks up package updates.
  gate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Download CI change selection
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide whether to publish
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" != workflow_run ]; then
            publish=true
          elif [ -f ci-changes.env ]; then
            publish="$(sed -n 's/^images=//p' ci-changes.env)"
          else
            echo "::warning::CI change selection is unavailable; publishing the base image."
            publish=true
          fi
          case "${publish}" in
            true|false) ;;
            *) echo "::error::Unexpected images value '${publish}'."; exit 1 ;;
          esac
          echo "Publish base image: ${publish}"
          echo "publish=${publish}" >>"${GITHUB_OUTPUT}"

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            release: ubuntu24.04
          - variant: resolute
            release: ubuntu26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set build tag
        id: build
        run: |
          echo "tag=$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ./src/images/base-ubuntu
          build-args: VARIANT=${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/wyrd-company/devcontainers/base:${{ matrix.variant }}
            ghcr.io/wyrd-company/devcontainers/base:${{ matrix.release }}
            ghcr.io/wyrd-company/devcontainers/base:${{ steps.build.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.build.outputs.created }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Attest image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/wyrd-company/devcontainers/base
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  arm64-smoke:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      matrix:
        variant: [noble, resolute]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify arm64 init and command
        run: |
          image="ghcr.io/wyrd-company/devcontainers/base:${{ matrix.variant }}"
          docker pull --platform linux/arm64 "$image"
          docker run --rm --platform linux/arm64 "$image" sh -c 'test "$(uname -m)" = aarch64 && tr "\0" " " </proc/1/cmdline | grep -q s6-svscan'

  cleanup:
    needs: arm64-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Retain twelve dated builds per variant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cleanup-ghcr-images.sh --execute
