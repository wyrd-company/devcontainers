name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-t3code-package-source-resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test package source resolver
        run: |
          python3 test/features/t3code-server/test_resolve_package_source.py
          python3 test/features/t3code-server/test_source_contract.py

  test-features-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - codex-cli
          - claude-code-cli
          - cursor-agent-cli
          - grok-cli
          - opencode-cli
        baseImage:
          - debian:bookworm
          - mcr.microsoft.com/devcontainers/base:noble
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test autogenerated scenario
        run: ./scripts/test-features.sh --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }}

  test-feature-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - caddy
          - dagu
          - grok-cli
          - openobserve
          - opencode-cli
          - opencodex
          - t3code-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test declared scenarios
        run: ./scripts/test-features.sh -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated

  test-t3code-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test autogenerated scenario
        run: ./scripts/test-features.sh --skip-scenarios -f t3code-server -i ghcr.io/wyrd-company/devcontainers/base:noble

  test-opencodex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test autogenerated scenario
        run: ./scripts/test-features.sh --skip-scenarios -f opencodex -i ghcr.io/wyrd-company/devcontainers/base:noble

  test-s6-features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - caddy
          - dagu
          - openobserve
          - go
          - sshd
          - docker-outside-of-docker
          - docker-in-docker
        baseImage:
          - ghcr.io/wyrd-company/devcontainers/base:noble
        include:
          - feature: docker-outside-of-docker
            baseImage: ghcr.io/wyrd-company/devcontainers/base:resolute
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test s6-compatible Feature
        run: ./scripts/test-features.sh --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }}

  test-caddy-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test Caddy runtime and hot reload
        run: ./scripts/test-caddy-runtime.sh

  test-t3code-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test T3 Code fork runtime
        run: ./scripts/test-t3code-runtime.sh

  test-opencodex-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test OpenCodex runtime under s6
        run: ./scripts/test-opencodex-runtime.sh

  test-dagu-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test Dagu runtime under s6
        run: ./scripts/test-dagu-runtime.sh

  test-openobserve-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test OpenObserve runtime under s6
        run: ./scripts/test-openobserve-runtime.sh

  test-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [noble, resolute]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./src/images/base-ubuntu
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          tags: devcontainers-base:${{ matrix.variant }}

      - name: Test s6 runtime
        run: ./src/images/base-ubuntu/test/test.sh devcontainers-base:${{ matrix.variant }}

      - name: Verify Moby remains an explicit unsupported opt-in
        if: matrix.variant == 'resolute'
        run: ./scripts/test-moby-opt-in.sh devcontainers-base:resolute

  test-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate metadata and substitutions
        run: |
          jq -e '.id == "ubuntu" and .version == "1.0.0" and .options.imageVariant.default == "noble"' src/templates/ubuntu/devcontainer-template.json
          for variant in noble resolute; do
            sed "s/\${templateOption:imageVariant}/${variant}/g" src/templates/ubuntu/.devcontainer/devcontainer.json | jq -e --arg variant "$variant" '.image == ("ghcr.io/wyrd-company/devcontainers/base:" + $variant)'
          done
