name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select affected test targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            python3 scripts/ci-changes.py --all >>"${GITHUB_OUTPUT}"
          else
            python3 scripts/ci-changes.py "${BASE_SHA}" "${GITHUB_SHA}" >>"${GITHUB_OUTPUT}"
          fi

  test-t3code-package-source-resolver:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 't3code-server')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test package source resolver
        run: |
          python3 test/features/t3code-server/test_resolve_package_source.py
          python3 test/features/t3code-server/test_source_contract.py

  test-features-autogenerated:
    needs: changes
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.targets), matrix.feature) }}
    strategy:
      matrix:
        feature:
          - claude-code-cli
          - cursor-agent-cli
          - grok-cli
          - opencode-cli
          - pi-coding-agent-cli
        baseImage:
          - debian:bookworm
          - mcr.microsoft.com/devcontainers/base:noble
    steps:
      - name: Checkout
        if: env.AFFECTED == 'true'
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        if: env.AFFECTED == 'true'
        run: npm install -g @devcontainers/cli

      - name: Test autogenerated scenario
        if: env.AFFECTED == 'true'
        run: ./scripts/test-features.sh --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }}

  test-feature-scenarios:
    needs: changes
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.targets), matrix.feature) }}
    strategy:
      matrix:
        feature:
          - codex-cli
          - caddy
          - dagu
          - openbao-agent
          - opentelemetry-collector
          - grok-cli
          - openobserve
          - opencode-cli
          - opencodex
          - t3code-server
    steps:
      - name: Checkout
        if: env.AFFECTED == 'true'
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        if: env.AFFECTED == 'true'
        run: npm install -g @devcontainers/cli

      - name: Test declared scenarios
        if: env.AFFECTED == 'true'
        run: ./scripts/test-features.sh -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated

  test-t3code-server:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 't3code-server')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test autogenerated scenario
        run: ./scripts/test-features.sh --skip-scenarios -f t3code-server -i ghcr.io/wyrd-company/devcontainers/base:noble

  test-opencodex:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'opencodex')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test autogenerated scenario
        run: ./scripts/test-features.sh --skip-scenarios -f opencodex -i ghcr.io/wyrd-company/devcontainers/base:noble

  test-s6-features:
    needs: changes
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.targets), matrix.feature) }}
    strategy:
      matrix:
        feature:
          - codex-cli
          - caddy
          - dagu
          - openobserve
          - openbao-agent
          - opentelemetry-collector
          - go
          - sshd
          - docker-outside-of-docker
          - docker-in-docker
        baseImage:
          - ghcr.io/wyrd-company/devcontainers/base:noble
        include:
          - feature: docker-outside-of-docker
            baseImage: ghcr.io/wyrd-company/devcontainers/base:resolute
    steps:
      - name: Checkout
        if: env.AFFECTED == 'true'
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        if: env.AFFECTED == 'true'
        run: npm install -g @devcontainers/cli

      - name: Test s6-compatible Feature
        if: env.AFFECTED == 'true'
        run: ./scripts/test-features.sh --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }}

  test-caddy-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'caddy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test Caddy runtime and hot reload
        run: ./scripts/test-caddy-runtime.sh

  test-t3code-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 't3code-server')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test T3 Code fork runtime
        run: ./scripts/test-t3code-runtime.sh

  test-opencodex-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'opencodex')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test OpenCodex runtime under s6
        run: ./scripts/test-opencodex-runtime.sh

  test-dagu-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'dagu')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test Dagu runtime under s6
        run: ./scripts/test-dagu-runtime.sh

  test-openobserve-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'openobserve')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test OpenObserve runtime under s6
        run: ./scripts/test-openobserve-runtime.sh

  test-opentelemetry-collector-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'opentelemetry-collector')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test OpenTelemetry Collector runtime under s6
        run: ./scripts/test-opentelemetry-collector-runtime.sh

  test-openbao-agent-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'openbao-agent')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test OpenBao Agent runtime under s6
        run: ./scripts/test-openbao-agent-runtime.sh

  test-openbao-secret-files-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'openbao-agent')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test OpenBao secret files under s6
        run: ./scripts/test-openbao-secret-files-runtime.sh

  test-image:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'base-image')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [noble, resolute]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./src/images/base-ubuntu
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          tags: devcontainers-base:${{ matrix.variant }}

      - name: Test s6 runtime
        run: ./src/images/base-ubuntu/test/test.sh devcontainers-base:${{ matrix.variant }}

      - name: Test the unrestricted sudo check
        run: ./test/check-sudo-no-all/test.sh devcontainers-base:${{ matrix.variant }}

      - name: Verify Moby remains an explicit unsupported opt-in
        if: matrix.variant == 'resolute'
        run: ./scripts/test-moby-opt-in.sh devcontainers-base:resolute

  test-template:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'template')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate metadata and substitutions
        run: |
          jq -e '.id == "ubuntu" and .version == "1.0.0" and .options.imageVariant.default == "noble"' src/templates/ubuntu/devcontainer-template.json
          for variant in noble resolute; do
            sed "s/\${templateOption:imageVariant}/${variant}/g" src/templates/ubuntu/.devcontainer/devcontainer.json | jq -e --arg variant "$variant" '.image == ("ghcr.io/wyrd-company/devcontainers/base:" + $variant)'
          done

  test-codex-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.targets), 'codex-cli')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Test shared Codex app-server under s6
        run: ./scripts/test-codex-runtime.sh
